services:
  - type: web
    name: vocalcode-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix server ci && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: VITE_PUBLIC_DEMO
        value: "true"
